name: macOS portable beta

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-regression:
    name: Windows shared-code regression
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify shared code and packaging statics
        run: |
          pnpm lint
          pnpm build
          node --test tests/*.test.mjs

  macos-package:
    name: ${{ matrix.label }} native package and smoke test
    needs: windows-regression
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon arm64
            runner: macos-15
            arch: arm64
            machine: arm64
            artifact_arch: Apple-Silicon-arm64
          - label: Intel x64
            runner: macos-15-intel
            arch: x64
            machine: x86_64
            artifact_arch: Intel-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Require the native runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.machine }}"
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - name: Install build Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Read package metadata
        id: metadata
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          ROOT="Anthropology-Canteen-macOS-${{ matrix.artifact_arch }}-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ROOT}-beta" >> "$GITHUB_OUTPUT"
      - name: Install dependencies and build shared app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build native portable ZIP
        shell: bash
        run: bash packaging/macos/build-portable.sh "${{ matrix.arch }}"
      - name: Run native package, persistence, import, shutdown, and privacy smoke tests
        shell: bash
        run: |
          ROOT="outputs/${{ steps.metadata.outputs.root }}"
          bash packaging/macos/smoke-test.sh "$ROOT" "$ROOT.zip" "${{ matrix.arch }}"
      - name: Upload workflow-dispatch beta artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            outputs/*.zip
            outputs/*.sha256
          if-no-files-found: error
          retention-days: 14
