name: v1.3.4 internal macOS basic usability validation

on:
  push:
    branches: [codex/v1.3.4-macos-basic]
    paths-ignore:
      - docs/**
      - CHANGELOG.md

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-basic-validation
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'YZYanthrop/anthropology-canteen' && github.ref == 'refs/heads/codex/v1.3.4-macos-basic'
    name: Mac candidate and acceptance (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          path: acceptance
          persist-credentials: false

      - name: Validate exact branch and candidate execution selection
        id: execution
        run: python3 acceptance/packaging/macos/basic-acceptance/run.py --workflow-config acceptance/packaging/macos/basic-acceptance/execution.json

      - name: Check out frozen product source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.execution.outputs.product_sha }}
          path: product
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        if: steps.execution.outputs.mode == 'build'
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Build same-commit Mac candidate once
        if: steps.execution.outputs.mode == 'build'
        working-directory: product
        env:
          TEST_ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ steps.execution.outputs.product_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node -p 'require("./package.json").version')" = "1.3.4"
          pnpm install --frozen-lockfile
          pnpm build
          bash packaging/macos/build-portable.sh "$TEST_ARCH" "$GITHUB_WORKSPACE/candidate" --candidate
          git diff --exit-code

      - name: Retain original candidate ZIP and original checksum
        if: steps.execution.outputs.mode == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: v1.3.4-internal-macos-candidate-${{ matrix.arch }}-${{ steps.execution.outputs.product_sha }}
          path: |
            candidate/*.zip
            candidate/*.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Reuse original candidate artifact for affected-only test correction
        if: steps.execution.outputs.mode == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN: ${{ steps.execution.outputs.candidate_run }}
          SOURCE_SHA: ${{ steps.execution.outputs.product_sha }}
          TEST_ARCH: ${{ matrix.arch }}
        run: |
          test "$(gh api "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN" --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN" --jq .head_branch)" = "codex/v1.3.4-macos-basic"
          gh run download "$CANDIDATE_RUN" --name "v1.3.4-internal-macos-candidate-$TEST_ARCH-$SOURCE_SHA" --dir candidate

      - name: Install test-only browser client
        run: npm install --prefix "$RUNNER_TEMP/canteen-basic-tools" --ignore-scripts --no-audit --no-fund playwright-core@1.63.0

      - name: Verify final candidate and run separated acceptance
        env:
          TEST_ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ steps.execution.outputs.product_sha }}
          TEST_SUITES: ${{ steps.execution.outputs.suites }}
          SCHEDULER_CASES: ${{ steps.execution.outputs.scheduler_cases }}
          ACCEPTANCE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/canteen-basic-tools/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          ARCHIVES=("$GITHUB_WORKSPACE"/candidate/*.zip)
          test "${#ARCHIVES[@]}" = 1
          # Bash 3.2 treats an empty array as unset under nounset. Positional
          # arguments remain valid with zero optional arguments.
          set --
          if [[ -n "$SCHEDULER_CASES" ]]; then set -- --scheduler-cases "$SCHEDULER_CASES"; fi
          read -r -a SUITES <<< "$TEST_SUITES"
          python3 acceptance/packaging/macos/basic-acceptance/run.py \
            --arch "$TEST_ARCH" --source "$GITHUB_WORKSPACE/product" --product-sha "$SOURCE_SHA" \
            --candidate "${ARCHIVES[0]}" --scratch "$RUNNER_TEMP/canteen-basic-$GITHUB_RUN_ID-$TEST_ARCH" \
            --reports "$GITHUB_WORKSPACE/reports" --suites "${SUITES[@]}" "$@"

      - name: Always verify cleanup of only manifest-owned identities
        if: always() && steps.execution.outcome == 'success'
        env:
          TEST_ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ steps.execution.outputs.product_sha }}
        run: |
          python3 acceptance/packaging/macos/basic-acceptance/run.py --cleanup \
            --arch "$TEST_ARCH" --source "$GITHUB_WORKSPACE/product" --product-sha "$SOURCE_SHA" \
            --scratch "$RUNNER_TEMP/canteen-basic-$GITHUB_RUN_ID-$TEST_ARCH" --reports "$GITHUB_WORKSPACE/reports"

      - name: Retain separate results and synthetic failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v1.3.4-internal-macos-basic-${{ matrix.arch }}-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 30
