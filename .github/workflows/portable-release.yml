name: Portable release artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable normal release tag, for example v1.2.0
        required: false
        type: string
      candidate_sha:
        description: Full 40-character commit SHA for a pre-tag native candidate build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.event_name == 'workflow_dispatch' && (inputs.tag || inputs.candidate_sha) || github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate immutable release source
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || '' }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha || '' }}
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      version: ${{ steps.metadata.outputs.version }}
      windows_root: ${{ steps.metadata.outputs.windows_root }}
      source_root: ${{ steps.metadata.outputs.source_root }}
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@v6
        if: github.event_name != 'workflow_dispatch' || inputs.candidate_sha == ''
        with:
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Check out the requested candidate commit
        uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_sha != ''
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Require exactly one immutable source selector
        id: metadata
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$RELEASE_TAG" && -n "$CANDIDATE_SHA" ]] || [[ -z "$RELEASE_TAG" && -z "$CANDIDATE_SHA" ]]; then
              echo "workflow_dispatch requires exactly one of tag or candidate_sha." >&2
              exit 1
            fi
            if [[ -n "$CANDIDATE_SHA" ]]; then
              if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "candidate_sha must be a full 40-character commit SHA." >&2
                exit 1
              fi
              if [[ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]]; then
                echo "The checked out candidate does not match candidate_sha." >&2
                exit 1
              fi
            fi
          else
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release artifacts require a normal vX.Y.Z tag." >&2
              exit 1
            fi
          fi
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v${VERSION}" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $VERSION." >&2
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "windows_root=Anthropology-Canteen-Windows-x64-v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_root=Anthropology-Canteen-Source-v${VERSION}" >> "$GITHUB_OUTPUT"

  verify-shared:
    name: Verify shared application
    needs: validate-tag
    runs-on: windows-latest
    steps:
      - name: Check out the validated source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, build, and run deterministic tests
        run: |
          pnpm lint
          pnpm build
          node --test tests/*.test.mjs

  windows-package:
    name: Windows x64 native package and smoke test
    needs: [validate-tag, verify-shared]
    runs-on: windows-latest
    steps:
      - name: Check out the validated source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Install build Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies and build shared app
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Windows x64 portable ZIP
        shell: pwsh
        run: ./packaging/windows/build-portable.ps1

      - name: Run Windows package, persistence, shutdown, and privacy smoke tests
        shell: pwsh
        run: |
          $root = "outputs/${{ needs.validate-tag.outputs.windows_root }}"
          $smokeShell = Join-Path $PSHOME "pwsh.exe"
          & $smokeShell -NoLogo -NoProfile -File `
            ./packaging/windows/smoke-test.ps1 `
            -PackageRoot $root `
            -ZipPath "$root.zip"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows portable smoke test failed with exit code $LASTEXITCODE."
          }

      - name: Upload Windows release-candidate artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.validate-tag.outputs.windows_root }}
          path: |
            outputs/${{ needs.validate-tag.outputs.windows_root }}.zip
            outputs/${{ needs.validate-tag.outputs.windows_root }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
  macos-package:
    name: ${{ matrix.label }} native package and smoke test
    needs: [validate-tag, verify-shared]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon arm64
            runner: macos-15
            arch: arm64
            machine: arm64
            artifact_arch: Apple-Silicon-arm64
          - label: macOS Intel x64
            runner: macos-15-intel
            arch: x64
            machine: x86_64
            artifact_arch: Intel-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the validated source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}

      - name: Require the native runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Install build Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies and build shared app
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build native portable ZIP
        shell: bash
        run: bash packaging/macos/build-portable.sh "${{ matrix.arch }}"

      - name: Run native package, persistence, import, shutdown, and privacy smoke tests
        shell: bash
        run: |
          ROOT="outputs/Anthropology-Canteen-macOS-${{ matrix.artifact_arch }}-v${{ needs.validate-tag.outputs.version }}"
          bash packaging/macos/smoke-test.sh "$ROOT" "$ROOT.zip" "${{ matrix.arch }}"

      - name: Upload macOS release-candidate artifact
        uses: actions/upload-artifact@v6
        with:
          name: Anthropology-Canteen-macOS-${{ matrix.artifact_arch }}-v${{ needs.validate-tag.outputs.version }}
          path: |
            outputs/Anthropology-Canteen-macOS-${{ matrix.artifact_arch }}-v${{ needs.validate-tag.outputs.version }}.zip
            outputs/Anthropology-Canteen-macOS-${{ matrix.artifact_arch }}-v${{ needs.validate-tag.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  source-package:
    name: Source archive from the validated tag
    needs: [validate-tag, verify-shared]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validated source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}

      - name: Create and inspect the source archive
        shell: bash
        run: |
          mkdir -p outputs
          ROOT="${{ needs.validate-tag.outputs.source_root }}"
          git archive --format=zip --prefix="${ROOT}/" --output="outputs/${ROOT}.zip" HEAD
          if zipinfo -1 "outputs/${ROOT}.zip" | grep -E -i '(^|/)(data|node_modules|release|outputs|dist|\.env[^/]*|\.pnpm-store|\.next|\.vinext|\.wrangler)(/|$)' >/dev/null; then
            echo "The source archive contains a generated or private path." >&2
            exit 1
          fi
          if git grep -I -n -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- . >/dev/null; then
            echo "The validated source contains a high-confidence secret marker." >&2
            exit 1
          fi
          (
            cd outputs
            sha256sum "${ROOT}.zip" >"${ROOT}.zip.sha256"
          )

      - name: Upload source release-candidate artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.validate-tag.outputs.source_root }}
          path: |
            outputs/${{ needs.validate-tag.outputs.source_root }}.zip
            outputs/${{ needs.validate-tag.outputs.source_root }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
